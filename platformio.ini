; Flight Eye — full firmware for the ESP32 CYD (ESP32-2432S028R)
[env:cyd]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.filesystem = littlefs
board_build.partitions = partitions_ota_4mb.csv

lib_ldf_mode = chain
lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    bblanchon/ArduinoJson @ ^7
    ESP32Async/ESPAsyncWebServer
    ESP32Async/AsyncTCP
    ricmoo/QRCode

build_flags =
    -DUSER_SETUP_LOADED=1
    ; ---- CYD display (v1/v2). For a v3 board, swap to ST7789_DRIVER. ----
    -DILI9341_2_DRIVER=1
    ; -DST7789_DRIVER=1
    ; -DTFT_RGB_ORDER=TFT_BGR
    ; -DTFT_INVERSION_ON=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DSPI_FREQUENCY=55000000
    -DSPI_READ_FREQUENCY=20000000
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
